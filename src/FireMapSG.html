<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FireMap SG — Prototype</title>

<!-- React + Babel (in-browser JSX) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Tailwind (JIT, no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
  html, body { margin: 0; padding: 0; background: #050608; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  input::placeholder { color: #5B6478; }
  ::-webkit-scrollbar { width: 0px; height: 0px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ---------------------------------------------------------------------- */
/* THEME TOKENS                                                            */
/* ---------------------------------------------------------------------- */
const RED = "#E5342B";
const RED_DIM = "#7A231F";
const GREEN = "#1FAE5C";
const BLUE = "#3B82F6";
const AMBER = "#F5A623";
const BG = "#0A0D14";
const PANEL = "#12161F";
const PANEL2 = "#181D29";
const BORDER = "#232939";
const TEXT = "#F2F3F6";
const SUBTEXT = "#8992A6";

/* ---------------------------------------------------------------------- */
/* ICON SET — hand-built inline SVGs, zero external icon dependency        */
/* ---------------------------------------------------------------------- */
function Icon({ name, size = 18, color = "currentColor", strokeWidth = 2 }) {
  const common = {
    width: size, height: size, viewBox: "0 0 24 24",
    fill: "none", stroke: color, strokeWidth,
    strokeLinecap: "round", strokeLinejoin: "round",
  };
  switch (name) {
    case "flame":
      return (<svg {...common} fill={color} stroke="none"><path d="M12 2c1.2 3-1.6 4.4-1.6 7.2A3.6 3.6 0 0 0 14 12.8c0-1.6-.8-2.4-1.2-3.2 1.6 1.2 3.2 3.6 3.2 6a6 6 0 1 1-12 0c0-2.4 1.2-4 2.4-5.2C7.6 8 8.4 6 8.4 4.4 9.6 5.2 10 6.4 10 7.6 11.2 6 12 4 12 2z"/></svg>);
    case "bell":
      return (<svg {...common}><path d="M6 8a6 6 0 0 1 12 0c0 4.5 1.5 6 2 6.5H4C4.5 14 6 12.5 6 8Z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>);
    case "chevronLeft":
      return (<svg {...common}><polyline points="15 6 9 12 15 18"/></svg>);
    case "chevronRight":
      return (<svg {...common}><polyline points="9 6 15 12 9 18"/></svg>);
    case "settings":
      return (<svg {...common}><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" strokeDasharray="2 3"/></svg>);
    case "plus":
      return (<svg {...common}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>);
    case "minus":
      return (<svg {...common}><line x1="5" y1="12" x2="19" y2="12"/></svg>);
    case "box":
      return (<svg {...common}><path d="M12 3 4 7v10l8 4 8-4V7Z"/><path d="M4 7l8 4 8-4"/><line x1="12" y1="11" x2="12" y2="21"/></svg>);
    case "menu":
      return (<svg {...common}><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>);
    case "search":
      return (<svg {...common}><circle cx="11" cy="11" r="6"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>);
    case "filter":
      return (<svg {...common}><path d="M4 5h16l-6 7v6l-4 2v-8Z"/></svg>);
    case "star":
      return (<svg {...common} fill={color} stroke="none"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.6 6.8L12 16.9 5.8 20.4l1.6-6.8L2.2 9l6.9-.7Z"/></svg>);
    case "users":
      return (<svg {...common}><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.5 14.2c2.6.4 4.5 2.6 4.5 5.3"/></svg>);
    case "refresh":
      return (<svg {...common}><path d="M20 11A8 8 0 0 0 6 6.3L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14 4.7l2-2"/><path d="M20 20v-4h-4"/></svg>);
    case "fingerprint":
      return (<svg {...common}><path d="M12 3a9 9 0 0 0-9 9c0 2 .5 3.5 1 4.5"/><path d="M12 3a9 9 0 0 1 9 9c0 1.5-.2 2.7-.5 3.7"/><path d="M8 20c-1.2-1.5-2-3.6-2-6a6 6 0 0 1 12 0c0 .8-.1 1.6-.3 2.3"/><path d="M12 22c-1-1-2-3-2-6a2 2 0 0 1 4 0c0 1.2.3 2.2.8 3"/></svg>);
    case "eye":
      return (<svg {...common}><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>);
    case "eyeOff":
      return (<svg {...common}><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a15.5 15.5 0 0 1-4 4.6M6.6 6.6C4 8.3 2 12 2 12s3.5 7 10 7c1.4 0 2.6-.3 3.7-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>);
    case "zap":
      return (<svg {...common} fill={color} stroke="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>);
    case "batteryCharging":
      return (<svg {...common}><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="10" x2="22" y2="14"/><path d="M11 9l-2.5 4H11l-2 4 4.5-5H11l1.5-3Z" fill={color} stroke="none"/></svg>);
    case "shieldAlert":
      return (<svg {...common}><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5Z"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.3" r="0.3" fill={color} stroke="none"/></svg>);
    case "arrowUp":
      return (<svg {...common}><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>);
    case "cornerUpLeft":
      return (<svg {...common}><polyline points="9 14 4 9 9 4"/><path d="M4 9h11a4 4 0 0 1 4 4v6"/></svg>);
    case "logOut":
      return (<svg {...common}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>);
    case "building":
      return (<svg {...common}><rect x="4" y="3" width="16" height="18" rx="1"/><line x1="8" y1="7" x2="8" y2="7.01"/><line x1="12" y1="7" x2="12" y2="7.01"/><line x1="16" y1="7" x2="16" y2="7.01"/><line x1="8" y1="11" x2="8" y2="11.01"/><line x1="12" y1="11" x2="12" y2="11.01"/><line x1="16" y1="11" x2="16" y2="11.01"/><line x1="9" y1="21" x2="9" y2="17"/><line x1="15" y1="21" x2="15" y2="17"/></svg>);
    case "route":
      return (<svg {...common}><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 3-3v-1a3 3 0 0 0-3-3H9a3 3 0 0 1-3-3V6a3 3 0 0 1 1-2.2"/></svg>);
    case "info":
      return (<svg {...common}><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.4" fill={color} stroke="none"/></svg>);
    case "wifi":
      return (<svg {...common}><path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5 12a11 11 0 0 1 14 0"/><path d="M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="0.6" fill={color} stroke="none"/></svg>);
    case "signal":
      return (<svg {...common} fill={color} stroke="none"><rect x="2" y="14" width="3" height="7" rx="0.5"/><rect x="7.5" y="10" width="3" height="11" rx="0.5"/><rect x="13" y="6" width="3" height="15" rx="0.5"/><rect x="18.5" y="2" width="3" height="19" rx="0.5"/></svg>);
    case "batteryFull":
      return (<svg {...common}><rect x="2" y="7" width="18" height="10" rx="2"/><line x1="22" y1="10" x2="22" y2="14"/><rect x="4" y="9" width="14" height="6" rx="1" fill={color} stroke="none"/></svg>);
    case "radio":
      return (<svg {...common}><circle cx="12" cy="16" r="2.5"/><path d="M8 12a5.5 5.5 0 0 1 8 0"/><path d="M5.5 9.5a9 9 0 0 1 13 0"/></svg>);
    default:
      return (<svg {...common}><circle cx="12" cy="12" r="9"/></svg>);
  }
}

/* ---------------------------------------------------------------------- */
/* MOCK DATA                                                               */
/* ---------------------------------------------------------------------- */
const BUILDING = {
  name: "Block 123, Ang Mo Kio Ave 1",
  type: "Residential (HDB)",
  levels: 15,
  incidentTime: "21:43",
};

const HAZARDS = [
  { id: 1, name: "Electrical Room", desc: "High Voltage Equipment", risk: "HIGH RISK", loc: "L5-01", icon: "zap", color: RED },
  { id: 2, name: "Battery Storage Room", desc: "Lithium-ion Batteries", risk: "MEDIUM RISK", loc: "L5-02", icon: "batteryCharging", color: AMBER },
  { id: 3, name: "Gas Meter Room", desc: "Combustible gas supply", risk: "LOW RISK", loc: "L5-03", icon: "flame", color: GREEN },
];

const BUILDINGS = [
  { id: 1, name: "Block 123, AMK Ave 1", meta: "Residential (HDB) · 15 Floors", fav: true },
  { id: 2, name: "Northpoint City", meta: "Commercial · 6 Floors", fav: false },
  { id: 3, name: "Yishun Community Hospital", meta: "Institutional · 8 Floors", fav: false },
  { id: 4, name: "Blk 88, Toa Payoh Lor 4", meta: "Residential (HDB) · 12 Floors", fav: false },
];

const STEPS = [
  { id: 1, icon: "arrowUp", label: "Enter via Staircase B", meta: "12 m", active: true },
  { id: 2, icon: "cornerUpLeft", label: "Turn Left", meta: "8 m" },
  { id: 3, icon: "arrowUp", label: "Go Straight", meta: "6 m" },
  { id: 4, icon: "R", label: "Riser Ahead", meta: "6 m" },
  { id: 5, icon: "flame", label: "Arrived at Level 5", meta: "Fire Location", final: true },
];

const TEAMS = [
  { id: "alpha", label: "Alpha Team", level: "Level 5", x: 34, y: 44, color: RED },
  { id: "bravo", label: "Bravo Team", level: "Level 3", x: 78, y: 66, color: BLUE },
];

/* ---------------------------------------------------------------------- */
/* STATUS BAR / HEADER / BOTTOM NAV                                        */
/* ---------------------------------------------------------------------- */
function StatusBar() {
  return (
    <div className="flex items-center justify-between px-6 pt-3 pb-1 text-[13px] font-semibold" style={{ color: TEXT }}>
      <span>9:41</span>
      <div className="flex items-center gap-1.5">
        <Icon name="signal" size={14} color={TEXT} />
        <Icon name="wifi" size={14} color={TEXT} />
        <Icon name="batteryFull" size={16} color={TEXT} />
      </div>
    </div>
  );
}

function Header({ title, onBack, right }) {
  return (
    <div className="flex items-center justify-between px-4 py-3">
      <div className="flex items-center gap-3">
        {onBack ? (
          <button onClick={onBack} className="text-white/90">
            <Icon name="chevronLeft" size={22} color={TEXT} />
          </button>
        ) : (
          <Icon name="menu" size={20} color={TEXT} />
        )}
        <span className="text-[17px] font-semibold" style={{ color: TEXT }}>{title}</span>
      </div>
      {right}
    </div>
  );
}

function BottomNav({ screen, go }) {
  const items = [
    { id: "dashboard", label: "Home", icon: "flame" },
    { id: "buildings", label: "Buildings", icon: "building" },
    { id: "hazards", label: "Hazards", icon: "shieldAlert" },
    { id: "team", label: "Team", icon: "users" },
  ];
  return (
    <div className="flex items-stretch justify-around border-t px-2 pt-2 pb-5" style={{ background: PANEL, borderColor: BORDER }}>
      {items.map((it) => {
        const activeItem = screen === it.id || (it.id === "dashboard" && (screen === "floorplan" || screen === "navigation"));
        return (
          <button key={it.id} onClick={() => go(it.id)} className="flex flex-col items-center gap-1 px-3 py-1 rounded-lg">
            <Icon name={it.icon} size={19} color={activeItem ? RED : SUBTEXT} strokeWidth={activeItem ? 2.4 : 2} />
            <span className="text-[10px] font-medium" style={{ color: activeItem ? RED : SUBTEXT }}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* SHARED FLOOR MAP (SVG)                                                  */
/* ---------------------------------------------------------------------- */
function FloorMap({ variant = "full", onFireClick }) {
  const rooms = [
    [8, 8, 34, 30], [46, 8, 22, 20], [72, 8, 20, 24],
    [8, 42, 22, 24], [34, 40, 22, 26], [60, 40, 32, 26],
    [8, 70, 40, 22], [52, 70, 40, 22],
  ];
  return (
    <svg viewBox="0 0 100 100" className="w-full h-full">
      <rect x="2" y="2" width="96" height="96" rx="3" fill={PANEL2} stroke={BORDER} strokeWidth="0.6" />
      {rooms.map((r, i) => (
        <rect key={i} x={r[0]} y={r[1]} width={r[2]} height={r[3]} fill="none" stroke="#2C3346" strokeWidth="0.6" />
      ))}
      <path d="M 20 82 L 20 55 L 40 55 L 40 30" fill="none" stroke={BLUE} strokeWidth="1.3" strokeDasharray="2.4 2" />
      <g>
        <rect x="14" y="76" width="10" height="10" rx="2" fill={BLUE} />
        <text x="19" y="83.2" fontSize="6" fontWeight="700" fill="#fff" textAnchor="middle">S</text>
      </g>
      {[[30, 12], [90, 16], [78, 55]].map((p, i) => (
        <g key={i}>
          <rect x={p[0] - 5} y={p[1] - 5} width="10" height="10" rx="2" fill={GREEN} />
          <text x={p[0]} y={p[1] + 2.2} fontSize="6" fontWeight="700" fill="#fff" textAnchor="middle">R</text>
        </g>
      ))}
      <g>
        <polygon points="86,58 90,66 82,66" fill={AMBER} />
        <text x="86" y="64.5" fontSize="5" fontWeight="700" fill="#241900" textAnchor="middle">!</text>
      </g>
      <g onClick={onFireClick} style={{ cursor: onFireClick ? "pointer" : "default" }}>
        <circle cx="40" cy="24" r="9" fill={RED} opacity="0.22" />
        <circle cx="40" cy="24" r="5.2" fill={RED} />
        <path d="M40 20.5c1 1.4 2.2 2 2.2 3.6a2.2 2.2 0 1 1-4.4 0c0-.9.5-1.4 1-1.9.4.5.8.8 1.2.3z" fill="#fff" />
      </g>
      {variant === "team" && TEAMS.map((t) => (
        <g key={t.id}>
          <circle cx={t.x} cy={t.y} r="4" fill={t.color} />
          <circle cx={t.x} cy={t.y} r="7" fill={t.color} opacity="0.25" />
        </g>
      ))}
    </svg>
  );
}

/* ---------------------------------------------------------------------- */
/* SMALL UI PIECES                                                         */
/* ---------------------------------------------------------------------- */
function Pill({ children, color }) {
  return (
    <span className="text-[10px] font-bold px-2 py-1 rounded-md" style={{ background: color + "22", color }}>
      {children}
    </span>
  );
}

function QuickAction({ icon, title, sub, color, onClick }) {
  return (
    <button onClick={onClick} className="flex-1 min-w-[45%] flex items-center justify-between gap-2 rounded-xl px-3.5 py-3 text-left" style={{ background: PANEL2, border: `1px solid ${BORDER}` }}>
      <div className="flex items-center gap-2.5">
        <span className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style={{ background: color + "22" }}>
          <Icon name={icon} size={15} color={color} />
        </span>
        <div>
          <div className="text-[12.5px] font-semibold" style={{ color: TEXT }}>{title}</div>
          <div className="text-[10.5px]" style={{ color: SUBTEXT }}>{sub}</div>
        </div>
      </div>
      <Icon name="chevronRight" size={14} color={SUBTEXT} />
    </button>
  );
}

/* ---------------------------------------------------------------------- */
/* SCREENS                                                                  */
/* ---------------------------------------------------------------------- */
function LoginScreen({ go }) {
  const [showPw, setShowPw] = useState(false);
  return (
    <div className="flex flex-col h-full">
      <div className="px-6 pt-4">
        <div className="flex items-center gap-2 mb-8">
          <Icon name="shieldAlert" size={20} color={RED} />
          <span className="text-[13px] font-bold tracking-wide" style={{ color: SUBTEXT }}>SCDF · The Life Saving Force</span>
        </div>
        <h1 className="text-[26px] font-bold leading-tight" style={{ color: TEXT }}>Welcome Back,</h1>
        <h1 className="text-[26px] font-bold leading-tight mb-8" style={{ color: TEXT }}>Stay Safe, <span style={{ color: RED }}>Save Lives.</span></h1>

        <label className="text-[12px] font-semibold" style={{ color: SUBTEXT }}>Unit ID / NRIC</label>
        <input placeholder="Enter your Unit ID" className="w-full mt-1.5 mb-4 px-3.5 py-3 rounded-lg text-sm outline-none" style={{ background: PANEL2, border: `1px solid ${BORDER}`, color: TEXT }} />

        <label className="text-[12px] font-semibold" style={{ color: SUBTEXT }}>Password</label>
        <div className="w-full mt-1.5 mb-3 px-3.5 py-3 rounded-lg text-sm flex items-center justify-between" style={{ background: PANEL2, border: `1px solid ${BORDER}` }}>
          <input type={showPw ? "text" : "password"} placeholder="Enter password" className="bg-transparent outline-none flex-1" style={{ color: TEXT }} />
          <button onClick={() => setShowPw((v) => !v)}>
            <Icon name={showPw ? "eyeOff" : "eye"} size={16} color={SUBTEXT} />
          </button>
        </div>

        <div className="flex items-center justify-between mb-7 text-[12px]">
          <label className="flex items-center gap-2" style={{ color: SUBTEXT }}>
            <input type="checkbox" defaultChecked className="accent-red-600" /> Remember me
          </label>
          <span style={{ color: SUBTEXT }}>Forgot Password?</span>
        </div>

        <button onClick={() => go("dashboard")} className="w-full py-3.5 rounded-lg font-bold text-[15px] mb-4" style={{ background: RED, color: "#fff" }}>
          LOGIN
        </button>
        <button onClick={() => go("dashboard")} className="w-full py-3 rounded-full font-semibold text-[13px] flex items-center justify-center gap-2" style={{ background: PANEL2, border: `1px solid ${BORDER}`, color: TEXT }}>
          <Icon name="fingerprint" size={16} color={TEXT} /> Login with Biometrics
        </button>
        <p className="text-center text-[11px] mt-5" style={{ color: SUBTEXT }}>🔒 Secure Access for SCDF Personnel Only</p>
      </div>
    </div>
  );
}

function DashboardScreen({ go }) {
  return (
    <div className="flex flex-col h-full">
      <Header
        title="Incident Dashboard"
        right={
          <div className="relative">
            <Icon name="bell" size={19} color={TEXT} />
            <span className="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full text-[9px] font-bold flex items-center justify-center" style={{ background: RED, color: "#fff" }}>3</span>

      />

function FloorPlanScreen({ go }) {
  return (
    <div className="flex flex-col h-full">
      <Header title="Floor Plan – Level 5" onBack={() => go("dashboard")} right={<Icon name="settings" size={18} color={TEXT} />} />
      <div className="flex-1 overflow-y-auto px-4 pb-4">
        <div className="relative rounded-xl overflow-hidden mb-3" style={{ height: 300, border: `1px solid ${BORDER}` }}>
          <FloorMap />
          <div className="absolute right-2 top-2 flex flex-col rounded-lg overflow-hidden" style={{ border: `1px solid ${BORDER}` }}>
            <button className="w-8 h-8 flex items-center justify-center" style={{ background: PANEL2 }}><Icon name="plus" size={14} color={TEXT} /></button>
            <button className="w-8 h-8 flex items-center justify-center border-t" style={{ background: PANEL2, borderColor: BORDER }}><Icon name="minus" size={14} color={TEXT} /></button>
          </div>
          <button className="absolute right-2 bottom-2 w-8 h-8 rounded-lg flex items-center justify-center text-[10px] font-bold" style={{ background: PANEL2, border: `1px solid ${BORDER}`, color: TEXT }}>
            <Icon name="box" size={14} color={TEXT} />
          </button>
        </div>

        <div className="flex flex-wrap gap-x-4 gap-y-2 mb-4 text-[11px]" style={{ color: SUBTEXT }}>
          <span className="flex items-center gap-1.5"><Icon name="flame" size={11} color={RED} /> Fire Location</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-[3px] flex items-center justify-center text-[7px] font-bold text-white" style={{ background: GREEN }}>R</span> Riser</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-[3px] flex items-center justify-center text-[7px] font-bold text-white" style={{ background: BLUE }}>S</span> Staircase</span>
          <span className="flex items-center gap-1.5"><Icon name="shieldAlert" size={11} color={AMBER} /> Hazard</span>
          <span className="flex items-center gap-1.5"><span className="w-4 h-[2px] border-t-2 border-dashed" style={{ borderColor: BLUE }} /> Recommended Route</span>
        </div>

        <div className="flex flex-wrap gap-2.5">
          <QuickAction icon="route" title="Route to Fire" sub="Best Access Path" color={BLUE} onClick={() => go("navigation")} />
          <QuickAction icon="building" title="Nearest Riser" sub="22 m away" color={GREEN} onClick={() => {}} />
          <QuickAction icon="shieldAlert" title="Hazard Zones" sub="2 on this floor" color={AMBER} onClick={() => go("hazards")} />
          <QuickAction icon="info" title="Building Info" sub="Details & Systems" color={SUBTEXT} onClick={() => go("buildings")} />
        </div>
      </div>
      <BottomNav screen="dashboard" go={go} />
    </div>
  );
}

function NavigationScreen({ go }) {
  return (
    <div className="flex flex-col h-full">
      <Header title="Navigation Mode" onBack={() => go("floorplan")} right={<Icon name="settings" size={18} color={TEXT} />} />
      <div className="flex-1 overflow-y-auto px-4 pb-4">
        <div className="rounded-xl px-3.5 py-3 mb-3" style={{ background: PANEL2, border: `1px solid ${BORDER}` }}>
          <div className="flex items-center gap-2 mb-1">
            <Icon name="flame" size={13} color={RED} />
            <span className="text-[10px]" style={{ color: SUBTEXT }}>Destination</span>
          </div>
          <div className="text-[14px] font-bold mb-2.5" style={{ color: TEXT }}>Fire Location – Level 5</div>
          <div className="flex justify-between items-center">
            <div className="flex gap-6">
              <div><div className="text-[10px]" style={{ color: SUBTEXT }}>ETA</div><div className="text-[13px] font-bold" style={{ color: TEXT }}>00:45</div></div>
              <div><div className="text-[10px]" style={{ color: SUBTEXT }}>Distance</div><div className="text-[13px] font-bold" style={{ color: TEXT }}>32 m</div></div>
            </div>
            <Icon name="chevronRight" size={14} color={SUBTEXT} />
          </div>
        </div>

        <div className="flex flex-col gap-2 mb-4">
          {STEPS.map((s) => (
            <div key={s.id} className="flex items-center justify-between rounded-lg px-3 py-3" style={{ background: s.active ? RED : PANEL2, border: s.active ? "none" : `1px solid ${BORDER}` }}>
              <div className="flex items-center gap-3">
                <span className="w-7 h-7 rounded-md flex items-center justify-center text-[11px] font-bold" style={{ background: s.active ? "rgba(255,255,255,0.2)" : s.final ? RED_DIM : GREEN, color: "#fff" }}>
                  {s.icon === "R" ? "R" : <Icon name={s.icon} size={14} color="#fff" />}
                </span>
                <div>
                  <div className="text-[13px] font-semibold" style={{ color: "#fff" }}>{s.label}</div>
                  {s.final && <div className="text-[11px] text-white/70">{s.meta}</div>}
                </div>
              </div>
              {!s.final && <span className="text-[12px] font-semibold" style={{ color: s.active ? "#fff" : SUBTEXT }}>{s.meta}</span>}
            </div>
          ))}
        </div>

        <button onClick={() => go("dashboard")} className="w-full py-3.5 rounded-xl font-bold text-[14px]" style={{ background: RED, color: "#fff" }}>
          END NAVIGATION
        </button>
      </div>
    </div>
  );
}

function BuildingsScreen({ go }) {
  const [tab, setTab] = useState("Favourites");
  return (
    <div className="flex flex-col h-full">
      <Header title="Buildings" />
      <div className="px-4">
        <div className="flex items-center gap-2 mb-3 rounded-lg px-3 py-2.5" style={{ background: PANEL2, border: `1px solid ${BORDER}` }}>
          <Icon name="search" size={15} color={SUBTEXT} />
          <input placeholder="Search building / address" className="bg-transparent outline-none text-[13px] flex-1" style={{ color: TEXT }} />
          <Icon name="filter" size={15} color={SUBTEXT} />
        </div>
        <div className="flex gap-5 mb-3 text-[12.5px] font-semibold" style={{ borderBottom: `1px solid ${BORDER}` }}>
          {["Favourites", "Recent", "All Buildings"].map((t) => (
            <button key={t} onClick={() => setTab(t)} className="pb-2" style={{ color: tab === t ? RED : SUBTEXT, borderBottom: tab === t ? `2px solid ${RED}` : "2px solid transparent" }}>{t}</button>
          ))}
        </div>
      </div>
      <div className="flex-1 overflow-y-auto px-4 pb-2 flex flex-col gap-2.5">
        {BUILDINGS.map((b) => (
          <button key={b.id} onClick={() => go("dashboard")} className="flex items-center justify-between rounded-xl px-3.5 py-3 text-left" style={{ background: PANEL2, border: `1px solid ${BORDER}` }}>
            <div>
              <div className="text-[13.5px] font-bold" style={{ color: TEXT }}>{b.name}</div>
              <div className="text-[11px]" style={{ color: SUBTEXT }}>{b.meta}</div>
            </div>
            {b.fav && <Icon name="star" size={15} color={AMBER} />}
          </button>
        ))}
      </div>
      <BottomNav screen="buildings" go={go} />
    </div>
  );
}

function HazardsScreen({ go }) {
  const riskColor = { "HIGH RISK": RED, "MEDIUM RISK": AMBER, "LOW RISK": GREEN };
  return (
    <div className="flex flex-col h-full">
      <Header title="Hazard Zones – Level 5" onBack={() => go("dashboard")} />
      <div className="flex-1 overflow-y-auto px-4 pb-4 flex flex-col gap-2.5 pt-1">
        {HAZARDS.map((h) => (
          <div key={h.id} className="flex items-center justify-between rounded-xl px-3.5 py-3" style={{ background: PANEL2, border: `1px solid ${BORDER}` }}>
            <div className="flex items-center gap-3">
              <span className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: h.color + "22" }}>
                <Icon name={h.icon} size={16} color={h.color} />
              </span>
              <div>
                <div className="text-[13px] font-bold" style={{ color: TEXT }}>{h.name}</div>
                <div className="text-[11px]" style={{ color: SUBTEXT }}>{h.desc}</div>
              </div>
            </div>
            <div className="flex flex-col items-end gap-1">
              <Pill color={riskColor[h.risk]}>{h.risk}</Pill>
              <span className="text-[10px]" style={{ color: SUBTEXT }}>{h.loc}</span>
            </div>
          </div>
        ))}
      </div>
      <BottomNav screen="hazards" go={go} />
    </div>
  );
}

function TeamScreen({ go }) {
  const [tab, setTab] = useState("ALL TEAMS");
  return (
    <div className="flex flex-col h-full">
      <Header title="Team Tracking" right={<Icon name="refresh" size={17} color={TEXT} />} />
      <div className="px-4 flex gap-4 mb-3 text-[12px] font-semibold" style={{ borderBottom: `1px solid ${BORDER}` }}>
        {["ALL TEAMS", "ALPHA", "BRAVO", "CHARLIE"].map((t) => (
          <button key={t} onClick={() => setTab(t)} className="pb-2" style={{ color: tab === t ? RED : SUBTEXT, borderBottom: tab === t ? `2px solid ${RED}` : "2px solid transparent" }}>{t}</button>
        ))}
      </div>
      <div className="flex-1 overflow-y-auto px-4 pb-4">
        <div className="relative rounded-xl overflow-hidden mb-3" style={{ height: 230, border: `1px solid ${BORDER}` }}>
          <FloorMap variant="team" />
          <div className="absolute rounded-md px-2 py-1 text-[10px] font-bold text-white" style={{ background: RED, left: "22%", top: "26%" }}>Alpha Team<div className="font-normal opacity-80">Level 5</div></div>
          <div className="absolute rounded-md px-2 py-1 text-[10px] font-bold text-white" style={{ background: BLUE, left: "68%", top: "50%" }}>Bravo Team<div className="font-normal opacity-80">Level 3</div></div>
          <div className="absolute rounded-md px-2 py-1 text-[10px] font-bold text-white flex items-center gap-1" style={{ background: GREEN, left: "10%", bottom: "6%" }}>
            <span className="w-3 h-3 rounded-[3px] flex items-center justify-center text-[7px]" style={{ background: "rgba(255,255,255,0.25)" }}>R</span>
            Command Entrance
          </div>
        </div>
        <div className="flex flex-col gap-2">
          {[
            { name: "Alpha Team", status: "En route to Level 5", color: RED },
            { name: "Bravo Team", status: "Holding at Level 3", color: BLUE },
            { name: "Charlie Team", status: "Standing by — ground", color: GREEN },
          ].map((t) => (
            <div key={t.name} className="flex items-center justify-between rounded-xl px-3.5 py-2.5" style={{ background: PANEL2, border: `1px solid ${BORDER}` }}>
              <div className="flex items-center gap-2.5">
                <span className="w-2.5 h-2.5 rounded-full" style={{ background: t.color }} />
                <div>
                  <div className="text-[12.5px] font-bold" style={{ color: TEXT }}>{t.name}</div>
                  <div className="text-[10.5px]" style={{ color: SUBTEXT }}>{t.status}</div>
                </div>
              </div>
              <Icon name="radio" size={14} color={SUBTEXT} />
            </div>
          ))}
        </div>
      </div>
      <BottomNav screen="team" go={go} />
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* APP SHELL                                                                */
/* ---------------------------------------------------------------------- */
function FireMapSG() {
  const [screen, setScreen] = useState("login");

  const screens = {
    login: LoginScreen,
    dashboard: DashboardScreen,
    floorplan: FloorPlanScreen,
    navigation: NavigationScreen,
    buildings: BuildingsScreen,
    hazards: HazardsScreen,
    team: TeamScreen,
  };
  const Screen = screens[screen];

  return (
    <div className="min-h-screen w-full flex items-center justify-center py-8" style={{ background: "#050608" }}>
      <div className="flex flex-col items-center">
        <div className="relative rounded-[2.5rem] overflow-hidden shadow-2xl" style={{ width: 375, height: 780, background: BG, border: "10px solid #05060A" }}>
          <StatusBar />
          <div style={{ height: "calc(100% - 34px)" }}>
            <Screen go={setScreen} />
          </div>
        </div>
        {screen !== "login" && (
          <button onClick={() => setScreen("login")} className="flex items-center gap-1.5 mt-4 text-[12px] font-medium" style={{ color: SUBTEXT }}>
            <Icon name="logOut" size={13} color={SUBTEXT} /> Log out / restart demo
          </button>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FireMapSG />);
</script>
</body>
</html>
